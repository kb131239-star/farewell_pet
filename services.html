<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>산책 지도 · farewell pet</title>
<meta name="theme-color" content="#EEF4E2">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="app">
<header class="topbar app-top">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-paw"/></svg></span>farewell pet</a>
  <nav class="tabbar" aria-label="주 메뉴">
    <button type="button" data-view="map" aria-current="page"><svg class="i" aria-hidden="true"><use href="#i-map"/></svg><span>산책 지도</span></button>
    <button type="button" data-view="saved"><svg class="i" aria-hidden="true"><use href="#i-heart"/></svg><span>찜한 곳</span><b class="badge tnum" id="saved-count">0</b></button>
    <button type="button" data-view="history"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg><span>이용기록</span></button>
  </nav>
  <a class="me" href="profile.html" id="me" aria-label="내 프로필"></a>
</header>

<main>
  <section class="view view-map" id="view-map">
    <div class="map-head">
      <div>
        <h1 id="map-title">산책 지도</h1>
        <p id="map-hint">가고 싶은 곳을 누르면 산책로를 따라 걸어가요.</p>
      </div>
      <div class="pet-strip" id="pet-strip"></div>
    </div>
    <div class="map" id="map"></div>
  </section>

  <section class="view view-list" id="view-saved" hidden>
    <h1>찜한 곳</h1>
    <p class="lead">마음에 담아 둔 곳을 모아 봤어요.</p>
    <div class="list" id="saved-list"></div>
  </section>

  <section class="view view-list" id="view-history" hidden>
    <div class="list-head"><div><h1 id="history-title">이용기록</h1><p class="lead">다녀온 곳에서 어땠는지 남기면, 다음에 고를 때 참고할 수 있어요.</p></div><button type="button" class="btn btn-primary" id="add-record"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>기록 남기기</button></div>
    <div class="list" id="history-list"></div>
  </section>
</main>

<!-- 필터링 -->
<dialog class="sheet" id="filter" aria-labelledby="filter-title">
  <div class="grip" aria-hidden="true"></div>
  <div class="sheet-head"><span></span><h2 id="filter-title">필터링</h2><button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <form class="sheet-body" id="filter-form"></form>
  <div class="sheet-foot"><button type="button" class="btn-ghost" id="filter-reset"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>초기화</button><button type="submit" form="filter-form" class="btn btn-primary" id="filter-apply">적용하기</button></div>
</dialog>

<!-- 결과 -->
<dialog class="sheet full" id="results" aria-labelledby="results-title">
  <div class="sheet-head"><button type="button" class="icon-btn" id="results-back" aria-label="필터로 돌아가기"><svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><h2 id="results-title"></h2><button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <div class="applied" id="applied"></div>
  <div class="sheet-body" id="results-body"></div>
</dialog>

<!-- 상세 -->
<dialog class="sheet full" id="detail" aria-labelledby="detail-title">
  <div class="sheet-head"><button type="button" class="icon-btn" data-close aria-label="목록으로 돌아가기"><svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg></button><span></span><button type="button" class="icon-btn heart-btn" id="detail-heart" aria-pressed="false" aria-label="찜하기"><svg class="i" aria-hidden="true"><use href="#i-heart"/></svg></button></div>
  <div class="sheet-body detail-body" id="detail-body"></div>
  <div class="sheet-foot detail-foot"><a class="btn btn-soft" id="call"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg>전화문의</a><button type="button" class="btn btn-primary" id="ask"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>간편 돌봄문의</button></div>
</dialog>

<!-- 준비 중 / 기록 / 문의 -->
<dialog class="sheet" id="modal" aria-labelledby="modal-title">
  <div class="grip" aria-hidden="true"></div>
  <div class="sheet-head"><span></span><h2 id="modal-title"></h2><button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <form class="sheet-body" id="modal-form"></form>
  <div class="sheet-foot" id="modal-foot"></div>
</dialog>

<script src="common.js"></script>
<script src="minimi.js"></script>
<script src="trailmap.js"></script>
<script src="hospitals.js"></script>
<script src="places.js"></script>
<script src="app.js"></script>
</body>
</html>
