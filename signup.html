<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>로그인 · farewell pet</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="signup.css">
</head>
<body class="signup-page">
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-paw"/></svg></span>farewell pet</a>
  <a class="skip" href="services.html">서비스 둘러보기</a>
</header>
<main class="signup">
  <section class="signup-card">
    <div class="signup-art" id="signup-art" aria-hidden="true"></div>
    <h1 id="auth-title">다시 만나서 반가워요</h1>
    <p id="auth-lead">로그인하면 업체와 채팅으로 문의할 수 있어요.</p>
    <div class="providers">
      <button type="button" class="provider kakao" id="kakao"><span class="p-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 6l-.9 3.4 3.9-2.6c.6.1 1.2.1 1.8.1 5 0 9-3.1 9-7S17 4 12 4z" fill="currentColor"/></svg></span>카카오로 시작하기</button>
      <button type="button" class="provider naver" id="naver"><span class="p-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h4.6l4.8 7V5H19v14h-4.6l-4.8-7v7H5z" fill="currentColor"/></svg></span>네이버로 시작하기</button>
    </div>
    <div class="or" aria-hidden="true"><span>또는 이메일로</span></div>
    <form id="email-form" novalidate>
      <label class="auth-field">이메일<input type="email" name="email" autocomplete="email" inputmode="email" required></label>
      <label class="auth-field">비밀번호<input type="password" name="password" autocomplete="current-password" minlength="8" required></label>
      <p class="auth-error" id="auth-error" role="alert"></p>
      <p class="auth-ok" id="auth-ok" role="status"></p>
      <button class="btn btn-primary auth-submit" id="auth-submit" type="submit">이메일로 로그인</button>
    </form>
    <button type="button" class="auth-switch" id="auth-switch">처음이신가요? 이메일로 회원가입</button>
    <p class="notice">시연용 프로토타입이에요. 실제로 쓰는 비밀번호나 민감한 건강 정보는 입력하지 마세요.</p>
    <a class="back" href="index.html">처음 화면으로</a>
  </section>
</main>
<script src="common.js"></script>
<script src="minimi.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  $('#signup-art').innerHTML=Minimi.svg(Minimi.config(FP.load().pet));
  const next=FPAuth.safeNext(new URLSearchParams(location.search).get('next'));
  const db=FPAuth.getClient();
  const form=$('#email-form');
  let mode='login';
  const say=(err,ok)=>{$('#auth-error').textContent=err||'';$('#auth-ok').textContent=ok||'';};
  function paint(){
    const up=mode==='signup';
    $('#auth-title').textContent=up?'우리 아이의 일상을 함께 채워볼까요?':'다시 만나서 반가워요';
    $('#auth-submit').textContent=up?'이메일로 회원가입':'이메일로 로그인';
    $('#auth-switch').textContent=up?'이미 계정이 있어요. 로그인':'처음이신가요? 이메일로 회원가입';
    form.password.autocomplete=up?'new-password':'current-password';
    say();
  }
  $('#auth-switch').onclick=()=>{mode=mode==='login'?'signup':'login';paint();};
  if(!db){
    say(FPAuth.enabled?'로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.':'로그인 연결을 준비 중이에요. 지금은 가입 없이 둘러볼 수 있어요.');
    [...form.elements,$('#kakao'),$('#naver'),$('#auth-switch')].forEach(el=>el.disabled=true);
    return;
  }
  db.auth.getSession().then(({data})=>{if(data.session)location.replace(next);});
  /* 네이버는 아직 연결 전이고, 카카오는 Supabase에서 켜져 있을 때만 쓴다 */
  $('#naver').onclick=()=>FP.toast('네이버 로그인은 준비 중이에요.');
  let kakaoOn=false;
  FPAuth.providers().then(p=>{kakaoOn=!!p.kakao;});
  $('#kakao').onclick=async()=>{
    if(!kakaoOn){FP.toast('카카오 로그인은 준비 중이에요.');return;}
    const {error}=await db.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:FPAuth.baseUrl()+next}});
    if(error)say('카카오 로그인을 시작하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  };
  const message=e=>{
    const m=(e&&e.message)||'';
    if(/invalid login/i.test(m))return '이메일이나 비밀번호가 맞지 않아요.';
    if(/not confirmed/i.test(m))return '메일함에서 가입 확인을 먼저 해 주세요.';
    if(/already registered/i.test(m))return '이미 가입된 이메일이에요. 로그인해 주세요.';
    if(/rate limit/i.test(m))return '요청이 많아 잠시 막혔어요. 조금 뒤 다시 시도해 주세요.';
    return '처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
  };
  form.addEventListener('submit',async e=>{
    e.preventDefault();say();
    const email=form.email.value.trim(),password=form.password.value;
    if(!/^\S+@\S+\.\S+$/.test(email)){say('이메일 주소를 확인해 주세요.');form.email.focus();return;}
    if(password.length<8){say('비밀번호는 8자 이상으로 입력해 주세요.');form.password.focus();return;}
    const btn=$('#auth-submit');btn.disabled=true;
    try{
      if(mode==='signup'){
        const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:FPAuth.baseUrl()+next}});
        if(error)throw error;
        if(data.session)location.replace(next);
        else say('',`${email}로 확인 메일을 보냈어요. 메일의 링크를 누르면 가입이 끝나요.`);
      }else{
        const {error}=await db.auth.signInWithPassword({email,password});
        if(error)throw error;
        location.replace(next);
      }
    }catch(err){say(message(err));}
    finally{btn.disabled=false;}
  });
})();
</script>
</body>
</html>
